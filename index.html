<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasondi Chinese Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: sticky category bar over a single scrolling column; a bottom "your picks" tray slides up when items are selected.
   Single dark look, matching the printed menu (lacquer black, red brush, gold lettering). */
:root{
  --bg:#120707; --bg-2:#1d0b0a; --card:#241110; --line:#3a1a18;
  --fg:#f3e4d6; --muted:#b89a8a; --gold:#e7b23a; --gold-2:#f5d27a;
  --red:#b7211f; --red-2:#8d1512; --veg:#4caf6a; --nonveg:#d8463a;
  --display:'Caveat',cursive; --body:'Noto Sans',system-ui,sans-serif; --cjk:'Noto Serif TC','Noto Sans',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(183,33,31,.45),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(231,178,58,.12),transparent 50%);
  background-attachment:fixed;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 14px;text-align:center;position:relative}
.lanterns{position:absolute;left:8px;top:0;font-size:26px;letter-spacing:6px;opacity:.9}
.cjk{position:absolute;right:8px;top:14px;font-family:var(--cjk);color:var(--red);border:1.5px solid var(--red);padding:6px 4px;writing-mode:vertical-rl;font-size:15px;line-height:1;letter-spacing:4px;border-radius:3px}
.brand{margin:0;line-height:0}.brand img{width:190px;max-width:60%;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 3px var(--gold)}
.sub{letter-spacing:.32em;font-size:12px;text-transform:uppercase;color:var(--gold);margin-top:6px}
.tag{font-family:var(--display);font-size:22px;color:var(--fg);margin-top:8px}
.tag span{margin:0 6px;color:var(--red)}
.chinese{display:inline-block;margin-top:14px;padding:6px 22px;background:linear-gradient(90deg,transparent,var(--red) 12%,var(--red) 88%,transparent);font-family:var(--display);font-size:38px;color:var(--gold-2);font-weight:700;transform:rotate(-1.5deg)}
.chinese small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.3em;color:var(--fg);font-weight:600;transform:rotate(1.5deg)}
/* category bar */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(18,7,7,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font:600 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--red);border-color:var(--red);color:#fff}
nav button:focus-visible,.item:focus-visible,.tray button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* filters */
.filters{display:flex;gap:8px;justify-content:center;padding-block:14px 4px;flex-wrap:wrap}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.filters input{accent-color:var(--gold)}
/* sections */
section{padding-block:22px 8px}
h2{margin:0 0 4px;font-family:var(--display);font-size:34px;font-weight:700;color:var(--gold-2);display:flex;align-items:baseline;gap:12px;text-wrap:balance}
h2::before{content:"";width:34px;height:12px;background:var(--red);transform:skew(-20deg)}
h2 .zh{font-family:var(--cjk);font-size:18px;color:var(--red);letter-spacing:4px;margin-left:auto}
h3{margin:18px 0 2px;font-family:var(--display);font-size:24px;color:var(--gold);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;padding:12px 14px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:background .15s,border-color .15s}
.item:hover{background:var(--bg-2)}
.item.sel{background:var(--card);border-color:var(--gold)}
.dot{width:14px;height:14px;border:1.5px solid;border-radius:3px;display:grid;place-items:center}
.dot::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.v{color:var(--veg)} .dot.n{color:var(--nonveg)}
.name{font-weight:500;min-width:0}
.name small{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold-2);white-space:nowrap}
.price b{font-weight:400;color:var(--muted);font-size:12px;margin-right:2px}
.opts{grid-column:1/-1;display:none;gap:8px}
.item.sel .opts{display:flex}
.opts span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.opts span.on{border-color:var(--gold);color:var(--gold-2);background:var(--bg-2)}
.qty{grid-column:1/-1;display:none;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.item.sel .qty{display:flex}
.qty b{color:var(--fg);min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.qty i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:10px 14px}
footer{text-align:center;padding-block:40px 20px;color:var(--muted)}
footer .q{font-family:var(--display);font-size:28px;color:var(--gold);line-height:1.1}
footer .dre{letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin-top:14px}
/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--gold);box-shadow:0 -10px 40px rgba(0,0,0,.6);transform:translateY(110%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
.tray.show{transform:none}
.tray .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.tray .sum{flex:1;min-width:0}
.tray .sum b{display:block;font-size:20px;color:var(--gold-2);font-variant-numeric:tabular-nums}
.tray .sum span{font-size:13px;color:var(--muted)}
.tray button{border:0;border-radius:999px;padding:10px 16px;font:600 14px var(--body);cursor:pointer}
.tray .view{background:var(--red);color:#fff}
.tray .clr{background:transparent;color:var(--muted);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:720px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h4{margin:0 0 12px;font-family:var(--display);font-size:30px;color:var(--gold-2)}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-2);white-space:nowrap}
.sheet tfoot td{font-weight:700;border:0;padding-top:12px;font-size:17px}
.sheet p{color:var(--muted);font-size:13px;margin:14px 0 0}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row button{flex:1;border:0;border-radius:999px;padding:12px;font:600 14px var(--body);cursor:pointer}
.sheet .copy{background:var(--gold);color:#1a0c0c}
.sheet .close{background:transparent;color:var(--fg);border:1px solid var(--line)!important}

.lanterns span{display:inline-block;transform-origin:50% -10px;animation:sway 3.2s ease-in-out infinite}
.lanterns span:last-child{animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 16px;font:15px var(--body)}
.tools input::placeholder{color:var(--muted)}
.surprise{border:0;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a0c0c;font:700 14px var(--body);cursor:pointer;white-space:nowrap}
.surprise:active{transform:scale(.96)}
.tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag-p{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--red);color:#fff;font-weight:700}
.tag-c{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--gold);color:#1a0c0c;font-weight:700}
.chili{font-size:12px;letter-spacing:-2px;opacity:.9}
.item.sel .dot{transform:scale(1.15)}
.item.pop{animation:pop .35s}
@keyframes pop{30%{transform:scale(1.03)}}
.item.shake{animation:shake .6s;border-color:var(--gold);background:var(--card)}
@keyframes shake{20%{transform:rotate(-1.5deg)}40%{transform:rotate(1.5deg)}60%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}
.burst{position:fixed;pointer-events:none;font-size:22px;z-index:40;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:0;transition:width .4s}
.tray .sum span{display:block}
.cookie{margin:26px auto 0;max-width:320px;cursor:pointer;user-select:none}
.cookie .c{font-size:54px;transition:transform .3s}
.cookie:hover .c{transform:rotate(-8deg) scale(1.05)}
.cookie p{margin:6px 0 0;font-family:var(--display);font-size:22px;color:var(--gold-2);min-height:1.4em}
.cookie small{display:block;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tray,.item{transition:none}.lanterns span,.item.pop,.item.shake,.burst{animation:none}}
</style>

</head>

const $=s=>document.querySelector(s);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const inr=n=>'₹'+n;
let state={}; // key -> {qty,size}
try{state=JSON.parse(localStorage.getItem('kasondi-picks')||'{}')}catch(e){state={}}
const save=()=>{try{localStorage.setItem('kasondi-picks',JSON.stringify(state))}catch(e){}};
const items={};

function priceOf(it,size){ if(it.sizes){const s=it.sizes.find(x=>x[0]===size)||it.sizes[0];return s[1]} return it.p }

function build(){
  const nav=$('#nav'),menu=$('#menu');
  MENU.forEach((c,ci)=>{
    const id=slug(c.cat);
    const b=document.createElement('button');b.textContent=c.cat;b.dataset.t=id;
    b.onclick=()=>{document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b);
    const sec=document.createElement('section');sec.id=id;
    sec.innerHTML=`<h2>${c.cat}<span class="zh">${c.zh||''}</span></h2>`;
    c.groups.forEach((g,gi)=>{
      if(g.name&&c.groups.length>1)sec.insertAdjacentHTML('beforeend',`<h3>${g.name}</h3>`);
      const list=document.createElement('div');list.className='list';
      g.items.forEach((it,ii)=>{
        const key=`${ci}-${gi}-${ii}`;items[key]=it;
        const el=document.createElement('button');el.className='item';el.dataset.key=key;el.dataset.veg=it.v?1:0;
        const sz=it.sizes?`<b>${it.sizes.map(s=>s[0]).join(' / ')}</b> ${it.sizes.map(s=>s[1]).join(' / ')}`:inr(it.p);
        const tg=[it.pop?'<span class="tag-p">Popular</span>':'',it.chef?'<span class="tag-c">Chef\'s pick</span>':'',it.h?`<span class="chili" title="spice ${it.h}/3">${'🌶️'.repeat(it.h)}</span>`:''].join('');
        el.innerHTML=`<span class="dot ${it.v?'v':'n'}"></span><span class="name">${it.n}${it.s?`<small>(${it.s})</small>`:''}${tg?`<span class="tags">${tg}</span>`:''}</span><span class="price">${sz}</span>`+
          (it.sizes?`<span class="opts">${it.sizes.map(s=>`<span data-size="${s[0]}">${s[0]} · ₹${s[1]}</span>`).join('')}</span>`:'')+
          `<span class="qty"><i data-d="-1">−</i><b>1</b><i data-d="1">+</i><span>quantity</span></span>`;
        el.onclick=e=>{
          const t=e.target;
          if(t.dataset.size){state[key].size=t.dataset.size;render();return}
          if(t.dataset.d){state[key].qty=Math.max(0,state[key].qty+ +t.dataset.d);if(!state[key].qty)delete state[key];render();return}
          if(state[key])delete state[key];else{state[key]={qty:1,size:it.sizes?it.sizes[0][0]:null};burst(e.clientX,e.clientY,it.v?'🥦':'🔥');el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),400)}
          render();
        };
        list.appendChild(el);
      });
      sec.appendChild(list);
    });
    sec.insertAdjacentHTML('beforeend','<div class="empty" hidden>Nothing here matches your filter.</div>');
    menu.appendChild(sec);
  });
}

function render(){
  const veg=$('#fVeg').checked,non=$('#fNon').checked,onlySel=$('#fSel').checked,q=$('#q').value.trim().toLowerCase();
  let total=0,count=0;
  document.querySelectorAll('.item').forEach(el=>{
    const k=el.dataset.key,s=state[k],it=items[k];
    el.classList.toggle('sel',!!s);
    if(s){el.querySelector('.qty b').textContent=s.qty;total+=priceOf(it,s.size)*s.qty;count+=s.qty;
      el.querySelectorAll('.opts span').forEach(o=>o.classList.toggle('on',o.dataset.size===s.size))}
    const isV=el.dataset.veg==='1';
    el.hidden=(veg&&!isV)||(non&&isV)||(onlySel&&!s)||(q&&!it.n.toLowerCase().includes(q));
  });
  document.querySelectorAll('section').forEach(sec=>{
    const any=[...sec.querySelectorAll('.item')].some(i=>!i.hidden);
    sec.querySelector('.empty').hidden=any;
  });
  $('#total').textContent=inr(total);$('#total2').textContent=inr(total);
  $('#count').textContent=count+(count===1?' item selected':' items selected');
  $('#tray').classList.toggle('show',count>0);$('#meter').style.width=Math.min(100,total/12)+'%';
  $('#count').textContent+=total?' · '+(total<300?'a snack':total<700?'a good meal':total<1200?'a feast':'a banquet 🐉'):'';
  $('#rows').innerHTML=Object.entries(state).map(([k,s])=>{const it=items[k];
    return `<tr><td>${it.n}${s.size?' ('+s.size+')':it.s?' ('+it.s+')':''} × ${s.qty}</td><td>${inr(priceOf(it,s.size)*s.qty)}</td></tr>`}).join('');
  save();
}

function burst(x,y,ch){for(let i=0;i<7;i++){const b=document.createElement('span');b.className='burst';b.textContent=ch;b.style.left=x+'px';b.style.top=y+'px';
  b.style.setProperty('--dx',(Math.random()*160-80)+'px');b.style.setProperty('--dy',(-60-Math.random()*120)+'px');b.style.setProperty('--r',(Math.random()*360)+'deg');
  document.body.appendChild(b);setTimeout(()=>b.remove(),900)}}
const FORTUNES=["A plate of Chilli Chicken is in your near future.","Share your noodles and your luck doubles.","The dragon smiles on those who order prawns.","Spice today, stories tomorrow.","You will meet someone over fried rice.","Good food brings people together. So does dessert.","Order the Drums of Heaven. The cookie insists.","Your next bite will be your favourite.","A full table is a happy table."];
build();render();
$('#q').oninput=render;
$('#surprise').onclick=e=>{const vis=[...document.querySelectorAll('.item')].filter(i=>!i.hidden);const el=vis[Math.floor(Math.random()*vis.length)];if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');burst(e.clientX,e.clientY,'🎲');setTimeout(()=>el.classList.remove('shake'),700)};
$('#cookie').onclick=e=>{const f=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];$('#fortune').textContent=f;burst(e.clientX,e.clientY,'✨')};
['fVeg','fNon','fSel'].forEach(id=>$('#'+id).onchange=e=>{
  if(id==='fVeg'&&e.target.checked)$('#fNon').checked=false;
  if(id==='fNon'&&e.target.checked)$('#fVeg').checked=false;render()});
$('#clear').onclick=()=>{state={};render()};
$('#view').onclick=()=>$('#sheet').classList.add('show');
$('#close').onclick=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show')};
$('#copy').onclick=()=>{
  const txt='Kasondi order:\n'+[...$('#rows').rows].map(r=>r.cells[0].textContent+' — '+r.cells[1].textContent).join('\n')+'\nTotal '+$('#total2').textContent;
  navigator.clipboard.writeText(txt).then(()=>{$('#copy').textContent='Copied';setTimeout(()=>$('#copy').textContent='Copy list',1500)}).catch(()=>{});
};
// highlight active category
const secs=[...document.querySelectorAll('section')];
new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===e.target.id))})},{rootMargin:'-20% 0px -70% 0px'}).observe&&secs.forEach(s=>new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===e.target.id))})},{rootMargin:'-20% 0px -70% 0px'}).observe(s));
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&t.scrollIntoView()}
</script>
